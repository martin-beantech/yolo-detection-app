version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yolo-backend
    ports:
      - "8000:8000"
    environment:
      - YOLO_MODEL=yolov8n.pt
      - CONFIDENCE_THRESHOLD=0.25
      - CORS_ORIGINS=http://localhost:4200,http://localhost
      - MAX_FILE_SIZE=10485760
      - API_VERSION=1.0.0
    volumes:
      - ./backend:/app
      - yolo-models:/root/.cache/ultralytics
    networks:
      - yolo-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yolo-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - yolo-network
    restart: unless-stopped

networks:
  yolo-network:
    driver: bridge

volumes:
  yolo-models:
